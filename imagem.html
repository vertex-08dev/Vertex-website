<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador OG</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .canvas-bg {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(240, 210, 138, 0.08) 0%, transparent 60%);
        }
        .glass-panel {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(240, 210, 138, 0.3);
            border-radius: 24px;
            padding: 60px;
            text-align: center;
            max-width: 800px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #fff;
            font-size: 56px;
            margin: 0 0 16px 0;
            letter-spacing: -0.03em;
        }
        p {
            color: rgba(240, 210, 138, 0.8);
            font-size: 24px;
            margin: 0;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="canvas-bg"></div>
    <div class="glass-panel">
        <h1>VERTEX</h1>
        <p>Premium Immersive Assets</p>
    </div>
</body>
</html>
